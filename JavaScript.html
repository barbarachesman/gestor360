<script>
  (function () {
    var MESES = [
      'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
      'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
    ];

    var DIAS_SEMANA = [
      'domingo', 'segunda-feira', 'terça-feira', 'quarta-feira',
      'quinta-feira', 'sexta-feira', 'sábado'
    ];

    var state = {
      year: 2026,
      month: 10,
      selected: null,
      seed: null,
      ferias: null,
      iniciativas: null,
      cultura: null,
      culturaPage: 'guia',
      iniSlug: null
    };

    function parseYmd(ymd) {
      var p = ymd.split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    function toYmd(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function formatBr(ymd) {
      if (!ymd) return '—';
      var p = ymd.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }

    function eachDateInRange(startYmd, endYmd) {
      var out = [];
      var cur = parseYmd(startYmd);
      var end = parseYmd(endYmd || startYmd);
      while (cur <= end) {
        out.push(toYmd(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    function expandItems(seed) {
      var byDate = {};

      function add(date, item) {
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(item);
      }

      (seed.feriados || []).forEach(function (f) {
        eachDateInRange(f.date, f.endDate || f.date).forEach(function (d) {
          add(d, {
            name: f.name,
            tipo: f.tipo || 'nacional',
            origem: 'feriado'
          });
        });
      });

      (seed.eventos || []).forEach(function (e) {
        eachDateInRange(e.start, e.end || e.start).forEach(function (d) {
          add(d, {
            name: e.name,
            tipo: e.tipo || 'evento',
            origem: 'evento'
          });
        });
      });

      (seed.ausencias || []).forEach(function (a) {
        if (!a.inicio || !a.termino) return;
        eachDateInRange(a.inicio, a.termino).forEach(function (d) {
          add(d, {
            name: 'Férias · ' + a.nome + (a.statusProgramacao ? ' (' + a.statusProgramacao + ')' : ''),
            tipo: 'ferias',
            origem: 'ferias'
          });
        });
      });

      return byDate;
    }

    function uniqueTipos(items) {
      var seen = {};
      var out = [];
      items.forEach(function (it) {
        var t = it.tipo || 'evento';
        if (!seen[t]) {
          seen[t] = true;
          out.push(t);
        }
      });
      return out;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function statusClass(label) {
      var s = String(label || '').toLowerCase();
      if (s.indexOf('efetiv') >= 0 || s.indexOf('finaliz') >= 0) return 'efetivada';
      if (s.indexOf('aprovad') >= 0 || s === 'ativo') return 'aprovada';
      if (s.indexOf('aguard') >= 0 || s.indexOf('andamento') >= 0) return 'aguardando';
      if (s.indexOf('programar') >= 0 || s.indexOf('pendente') >= 0) return 'programar';
      if (s.indexOf('completo') >= 0) return 'completo';
      if (s.indexOf('incompleto') >= 0) return 'incompleto';
      return 'programar';
    }

    function setView(viewId) {
      var views = ['ferias', 'calendario', 'iniciativas', 'ajuda', 'cultura'];
      views.forEach(function (id) {
        var el = document.getElementById('view-' + id);
        if (el) el.hidden = id !== viewId;
      });
      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        var active = btn.getAttribute('data-view') === viewId;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function syncYearButtons() {
      document.querySelectorAll('.year-btn').forEach(function (btn) {
        var y = Number(btn.getAttribute('data-year'));
        btn.classList.toggle('is-active', y === state.year);
      });
    }

    function renderMonthList(byDate) {
      var list = document.getElementById('month-events');
      list.innerHTML = '';
      var y = state.year;
      var m = state.month;
      var keys = Object.keys(byDate).filter(function (k) {
        var d = parseYmd(k);
        return d.getFullYear() === y && d.getMonth() === m;
      }).sort();

      if (!keys.length) {
        list.innerHTML = '<li class="muted">Nenhum feriado, evento ou férias neste mês.</li>';
        return;
      }

      var seenNames = {};
      keys.forEach(function (k) {
        byDate[k].forEach(function (it) {
          var key = k + '|' + it.name;
          if (seenNames[key]) return;
          seenNames[key] = true;
          var li = document.createElement('li');
          var day = k.slice(8);
          li.innerHTML =
            '<span class="event-tipo">' + day + ' · ' + it.tipo + '</span>' +
            escapeHtml(it.name);
          list.appendChild(li);
        });
      });
    }

    function showDetail(ymd, items) {
      var title = document.getElementById('detail-title');
      var list = document.getElementById('detail-list');
      var d = parseYmd(ymd);
      title.textContent =
        d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
      list.innerHTML = '';

      if (!items || !items.length) {
        list.innerHTML = '<li class="muted">Sem feriados, eventos ou férias neste dia.</li>';
        return;
      }

      items.forEach(function (it) {
        var li = document.createElement('li');
        li.innerHTML =
          '<span class="event-tipo">' + escapeHtml(it.tipo) + '</span>' +
          escapeHtml(it.name);
        list.appendChild(li);
      });
    }

    function renderCalendar() {
      var byDate = expandItems(state.seed);
      var grid = document.getElementById('calendar-grid');
      var label = document.getElementById('month-label');
      label.textContent = MESES[state.month] + ' ' + state.year;
      syncYearButtons();

      var first = new Date(state.year, state.month, 1);
      var startPad = first.getDay();
      var daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
      var prevDays = new Date(state.year, state.month, 0).getDate();

      grid.innerHTML = '';
      var todayYmd = toYmd(new Date());
      var totalCells = 42;

      for (var i = 0; i < totalCells; i++) {
        var dayNum;
        var cellDate;
        var outside = false;

        if (i < startPad) {
          dayNum = prevDays - startPad + i + 1;
          cellDate = new Date(state.year, state.month - 1, dayNum);
          outside = true;
        } else if (i >= startPad + daysInMonth) {
          dayNum = i - (startPad + daysInMonth) + 1;
          cellDate = new Date(state.year, state.month + 1, dayNum);
          outside = true;
        } else {
          dayNum = i - startPad + 1;
          cellDate = new Date(state.year, state.month, dayNum);
        }

        var ymd = toYmd(cellDate);
        var items = byDate[ymd] || [];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-cell';
        if (outside) btn.classList.add('is-outside');
        if (ymd === todayYmd) btn.classList.add('is-today');
        if (state.selected === ymd) btn.classList.add('is-selected');
        btn.setAttribute('data-date', ymd);
        btn.setAttribute('aria-label', ymd);

        var marks = uniqueTipos(items)
          .map(function (t) {
            return '<span class="mark ' + t + '"></span>';
          })
          .join('');

        var shortLabel = items.length
          ? '<span class="day-label">' + escapeHtml(items[0].name) + '</span>'
          : '';

        btn.innerHTML =
          '<span class="day-num">' + dayNum + '</span>' +
          '<span class="day-marks">' + marks + '</span>' +
          shortLabel;

        btn.addEventListener('click', function (ev) {
          var date = ev.currentTarget.getAttribute('data-date');
          state.selected = date;
          renderCalendar();
          showDetail(date, byDate[date] || []);
        });

        grid.appendChild(btn);
      }

      renderMonthList(byDate);

      if (state.selected) {
        var sel = parseYmd(state.selected);
        if (sel.getFullYear() === state.year && sel.getMonth() === state.month) {
          showDetail(state.selected, byDate[state.selected] || []);
        }
      }
    }

    function renderFerias() {
      var root = document.getElementById('ferias-list');
      if (!root) return;
      var pessoas = (state.ferias && state.ferias.pessoas) || [];
      root.innerHTML = '';

      if (!pessoas.length) {
        root.innerHTML = '<div class="panel"><p class="muted">Nenhuma férias carregada.</p></div>';
        return;
      }

      pessoas.forEach(function (p) {
        var card = document.createElement('article');
        card.className = 'ferias-card';

        var head =
          '<div class="ferias-card-head">' +
          '<h3>' + escapeHtml(p.nome) + '</h3>' +
          '<span class="ferias-mat">Matrícula ' + escapeHtml(p.matricula) + '</span>' +
          '</div>';

        var body = '';
        (p.periodos || []).forEach(function (per) {
          body +=
            '<div class="periodo-block">' +
            '<div class="periodo-meta">' +
            '<span class="status-pill ' + statusClass(per.status) + '">' +
            escapeHtml(per.status || '—') +
            '</span>' +
            '<span>Saldo: <strong>' + escapeHtml(per.saldo || '—') + '</strong></span>' +
            '<span>Aquisitivo: ' +
            formatBr(per.aquisitivoInicio) +
            ' – ' +
            formatBr(per.aquisitivoFim) +
            '</span>' +
            '<span>Limite saída: ' + formatBr(per.limiteSaida) + '</span>' +
            '</div>';

          body +=
            '<table class="prog-table"><thead><tr>' +
            '<th>Programação</th><th>Início</th><th>Término</th><th>Dias</th><th>Status</th>' +
            '</tr></thead><tbody>';

          (per.programacoes || []).forEach(function (prog) {
            body +=
              '<tr>' +
              '<td>' + escapeHtml(prog.ordem || '—') + '</td>' +
              '<td>' + formatBr(prog.inicio) + '</td>' +
              '<td>' + formatBr(prog.termino) + '</td>' +
              '<td>' + escapeHtml(String(prog.dias != null ? prog.dias : '—')) + '</td>' +
              '<td><span class="status-pill ' +
              statusClass(prog.statusProgramacao) +
              '">' +
              escapeHtml(prog.statusProgramacao || '—') +
              '</span></td>' +
              '</tr>';
          });

          body += '</tbody></table></div>';
        });

        card.innerHTML = head + body;
        root.appendChild(card);
      });
    }

    function findIniciativa(slug) {
      var list = (state.iniciativas && state.iniciativas.iniciativas) || [];
      for (var i = 0; i < list.length; i++) {
        if (list[i].slug === slug) return list[i];
      }
      return null;
    }

    function renderIniSubmenu() {
      var nav = document.getElementById('ini-submenu');
      if (!nav) return;
      var list = (state.iniciativas && state.iniciativas.iniciativas) || [];
      nav.innerHTML = '';
      list.forEach(function (ini) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ini-sub-btn';
        if (state.iniSlug === ini.slug) btn.classList.add('is-active');
        btn.setAttribute('data-ini', ini.slug);
        btn.textContent = ini.titulo;
        btn.title = ini.titulo;
        btn.addEventListener('click', function () {
          showIniciativa(ini.slug);
        });
        nav.appendChild(btn);
      });

      document.querySelectorAll('.ini-sub-btn[data-ini="lista"]').forEach(function (btn) {
        btn.classList.toggle('is-active', !state.iniSlug);
      });
    }

    function snippet(text, maxLen) {
      var t = String(text || '').replace(/\s+/g, ' ').trim();
      if (t.length <= maxLen) return t;
      return t.slice(0, maxLen - 1) + '…';
    }

    function bmMeta(bm) {
      if (!bm) return '';
      var bits = [];
      if (bm.coluna) bits.push(bm.coluna);
      if (bm.secao) bits.push(bm.secao);
      if (bm.lane) bits.push(bm.lane);
      if (bm.owner) bits.push(bm.owner);
      return bits.join(' · ');
    }

    function bmLinkHtml(bm, compact) {
      if (!bm || !bm.url) return '';
      var label = compact
        ? 'Businessmap #' + (bm.cardId || '')
        : 'Abrir no Businessmap';
      var meta = bmMeta(bm);
      return (
        '<div class="ini-bm">' +
        '<a class="ini-bm-link" href="' +
        escapeHtml(bm.url) +
        '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(label) +
        '</a>' +
        (meta
          ? '<span class="ini-bm-meta">' + escapeHtml(meta) + '</span>'
          : '') +
        (bm.matchTipo && bm.matchTipo.indexOf('aproximado') === 0
          ? '<span class="ini-bm-approx">match aproximado</span>'
          : '') +
        '</div>'
      );
    }

    function renderIniList() {
      var root = document.getElementById('ini-list');
      var detail = document.getElementById('ini-detail');
      if (!root || !detail) return;
      detail.hidden = true;
      root.hidden = false;
      root.innerHTML = '';
      var list = (state.iniciativas && state.iniciativas.iniciativas) || [];
      if (!list.length) {
        root.innerHTML = '<div class="panel"><p class="muted">Nenhuma iniciativa carregada.</p></div>';
        return;
      }
      list.forEach(function (ini) {
        var card = document.createElement('article');
        card.className = 'ini-card';
        card.innerHTML =
          '<div class="ini-meta">' +
          '<span class="status-pill ' +
          statusClass(ini.status) +
          '">' +
          escapeHtml(ini.status || 'Ativo') +
          '</span>' +
          (ini.id
            ? '<span>' + escapeHtml(ini.id) + '</span>'
            : '') +
          '</div>' +
          '<h3><a href="' +
          escapeHtml(ini.urlReferencia || '#') +
          '" target="_blank" rel="noopener noreferrer">' +
          escapeHtml(ini.titulo) +
          '</a></h3>' +
          bmLinkHtml(ini.businessmap, true) +
          '<div class="ini-block"><h4>Stakeholders</h4><p>' +
          escapeHtml(snippet(ini.stakeholders, 220)) +
          '</p></div>' +
          '<div class="ini-block"><h4>Métricas de sucesso</h4><p>' +
          escapeHtml(snippet(ini.metricasSucesso, 220)) +
          '</p></div>' +
          '<div class="ini-detail-actions">' +
          '<button type="button" class="year-btn" data-open-ini="' +
          escapeHtml(ini.slug) +
          '">Ver detalhes</button>' +
          '</div>';
        root.appendChild(card);
      });
      root.querySelectorAll('[data-open-ini]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          showIniciativa(btn.getAttribute('data-open-ini'));
        });
      });
    }

    function renderIniDetail(ini) {
      var root = document.getElementById('ini-list');
      var detail = document.getElementById('ini-detail');
      if (!root || !detail || !ini) return;
      root.hidden = true;
      detail.hidden = false;
      var bm = ini.businessmap || null;
      var entregas = (ini.entregas || [])
        .map(function (e) {
          return '<li>' + escapeHtml(e) + '</li>';
        })
        .join('');
      detail.innerHTML =
        '<div class="ini-detail-actions">' +
        '<button type="button" class="year-btn" id="ini-back">← Todas</button>' +
        '<a class="year-btn" href="' +
        escapeHtml(ini.urlReferencia || '#') +
        '" target="_blank" rel="noopener noreferrer">Abrir planilha</a>' +
        (bm && bm.url
          ? '<a class="year-btn" href="' +
            escapeHtml(bm.url) +
            '" target="_blank" rel="noopener noreferrer">Abrir Businessmap</a>'
          : '') +
        '</div>' +
        '<div class="ini-meta">' +
        '<span class="status-pill ' +
        statusClass(ini.status) +
        '">' +
        escapeHtml(ini.status || 'Ativo') +
        '</span>' +
        '<span>' +
        escapeHtml(ini.id || '') +
        '</span>' +
        (ini.abaCanvas
          ? '<span>Aba canvas: ' + escapeHtml(ini.abaCanvas) + '</span>'
          : '') +
        '</div>' +
        '<h2><a href="' +
        escapeHtml(ini.urlReferencia || '#') +
        '" target="_blank" rel="noopener noreferrer">' +
        escapeHtml(ini.titulo) +
        '</a></h2>' +
        (bm
          ? '<div class="ini-block"><h4>Businessmap</h4>' +
            bmLinkHtml(bm, false) +
            (bm.titulo
              ? '<p class="ini-bm-title">' + escapeHtml(bm.titulo) + '</p>'
              : '') +
            '</div>'
          : '') +
        '<div class="ini-block"><h4>Stakeholders</h4><p>' +
        escapeHtml(ini.stakeholders || '—') +
        '</p></div>' +
        '<div class="ini-block"><h4>Métricas de sucesso da entrega</h4><p>' +
        escapeHtml(ini.metricasSucesso || '—') +
        '</p></div>' +
        '<div class="ini-block"><h4>Resumo</h4><p>' +
        escapeHtml(ini.resumo || '—') +
        '</p></div>' +
        '<div class="ini-block"><h4>Objetivo</h4><p>' +
        escapeHtml(ini.objetivo || '—') +
        '</p></div>' +
        (entregas
          ? '<div class="ini-block"><h4>Principais entregas</h4><ul>' +
            entregas +
            '</ul></div>'
          : '') +
        (ini.ganhosCanal
          ? '<div class="ini-block"><h4>Ganhos para o canal</h4><p>' +
            escapeHtml(ini.ganhosCanal) +
            '</p></div>'
          : '') +
        (ini.ganhosCliente
          ? '<div class="ini-block"><h4>Ganhos para o cliente</h4><p>' +
            escapeHtml(ini.ganhosCliente) +
            '</p></div>'
          : '') +
        (ini.problemaOportunidade
          ? '<div class="ini-block"><h4>Problema / oportunidade</h4><p>' +
            escapeHtml(ini.problemaOportunidade) +
            '</p></div>'
          : '');
      var back = document.getElementById('ini-back');
      if (back) {
        back.addEventListener('click', function () {
          showIniciativa(null);
        });
      }
    }

    function showIniciativa(slug) {
      state.iniSlug = slug || null;
      renderIniSubmenu();
      if (!slug) {
        renderIniList();
        return;
      }
      var ini = findIniciativa(slug);
      if (!ini) {
        showIniciativa(null);
        return;
      }
      renderIniDetail(ini);
    }

    function formatSigned(n, digits) {
      if (n === null || n === undefined || n === '') return '—';
      var num = Number(n);
      if (isNaN(num)) return escapeHtml(String(n));
      var fixed = num.toFixed(digits === undefined ? 2 : digits);
      return (num > 0 ? '+' : '') + fixed;
    }

    function formatPct(n, digits) {
      if (n === null || n === undefined || n === '') return '—';
      var num = Number(n);
      if (isNaN(num)) return escapeHtml(String(n));
      var d = digits === undefined ? 0 : digits;
      var fixed = Number.isInteger(num) && d === 0 ? String(num) : num.toFixed(d);
      return fixed + '%';
    }

    function deltaClass(n) {
      var num = Number(n);
      if (isNaN(num) || num === 0) return 'clima-delta-flat';
      return num > 0 ? 'clima-delta-up' : 'clima-delta-down';
    }

    function renderCulturaGuia() {
      var grid = document.getElementById('cultura-grid');
      var aviso = document.getElementById('cultura-aviso');
      if (!grid) return;
      var data = state.cultura || {};
      var secoes = data.secoes || [];

      if (aviso) {
        if (data.aviso) {
          aviso.hidden = false;
          aviso.textContent = data.aviso;
        } else {
          aviso.hidden = true;
          aviso.textContent = '';
        }
      }

      if (!secoes.length) {
        grid.innerHTML =
          '<div class="panel"><p class="muted">Conteúdo de cultura ainda não carregado.</p></div>';
        return;
      }

      grid.innerHTML = secoes
        .map(function (sec) {
          var body = '';
          if (sec.checklist && sec.checklist.length) {
            body +=
              '<h4>' +
              escapeHtml(sec.checklistLabel || 'Checklist') +
              '</h4><ul class="doc-checklist">' +
              sec.checklist
                .map(function (item) {
                  return '<li>' + escapeHtml(item) + '</li>';
                })
                .join('') +
              '</ul>';
          }
          if (sec.principios && sec.principios.length) {
            body +=
              '<h4>Princípios</h4><ul class="doc-tenets">' +
              sec.principios
                .map(function (p) {
                  return (
                    '<li><strong>' +
                    escapeHtml(p.titulo) +
                    '</strong>' +
                    escapeHtml(p.texto || '') +
                    '</li>'
                  );
                })
                .join('') +
              '</ul>';
          }
          if (sec.nota) {
            body += '<p class="doc-note">' + escapeHtml(sec.nota) + '</p>';
          }
          if (sec.ondeAplicar && sec.ondeAplicar.length) {
            body +=
              '<h4>Onde aplicar</h4><ul class="doc-apply">' +
              sec.ondeAplicar
                .map(function (item) {
                  return '<li>' + escapeHtml(item) + '</li>';
                })
                .join('') +
              '</ul>';
          }
          return (
            '<article class="doc-card doc-card-rich" role="listitem">' +
            '<span class="badge">' +
            escapeHtml(sec.badge || '') +
            '</span>' +
            '<h3>' +
            escapeHtml(sec.titulo || '') +
            '</h3>' +
            '<p>' +
            escapeHtml(sec.resumo || '') +
            '</p>' +
            body +
            (sec.url
              ? '<p class="doc-meta"><a href="' +
                escapeHtml(sec.url) +
                '" target="_blank" rel="noopener noreferrer">Abrir no Guia de trabalho</a></p>'
              : '') +
            '</article>'
          );
        })
        .join('');
    }

    function renderNpsBlock(title, nps) {
      if (!nps) return '';
      var opinions = (nps.opiniones || [])
        .map(function (op) {
          return '<blockquote class="clima-quote">' + escapeHtml(op) + '</blockquote>';
        })
        .join('');
      return (
        '<section class="clima-section">' +
        '<h3>' +
        escapeHtml(title) +
        '</h3>' +
        '<div class="clima-kpi-row">' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Score</span><strong>' +
        escapeHtml(String(nps.score)) +
        '</strong><span class="' +
        deltaClass(nps.variacao) +
        '">' +
        formatSigned(nps.variacao, 0) +
        '</span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Rank</span><strong>' +
        escapeHtml(nps.rank || '—') +
        '</strong><span class="muted">melhor que ' +
        formatPct(nps.melhorQueEmpresasPct, 2) +
        ' das empresas</span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Promotores</span><strong>' +
        formatPct(nps.promotoresPct, 1) +
        '</strong><span class="' +
        deltaClass(nps.promotoresVariacaoPct) +
        '">' +
        formatSigned(nps.promotoresVariacaoPct, 1) +
        ' pp</span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Passivos</span><strong>' +
        formatPct(nps.passivosPct, 1) +
        '</strong><span class="' +
        deltaClass(nps.passivosVariacaoPct) +
        '">' +
        formatSigned(nps.passivosVariacaoPct, 1) +
        ' pp</span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Detratores</span><strong>' +
        formatPct(nps.detratoresPct, 1) +
        '</strong><span class="' +
        deltaClass(nps.detratoresVariacaoPct) +
        '">' +
        formatSigned(nps.detratoresVariacaoPct, 1) +
        ' pp</span></div>' +
        '</div>' +
        (opinions ? '<h4>Últimas opiniões</h4>' + opinions : '') +
        '</section>'
      );
    }

    function renderCulturaClima() {
      var root = document.getElementById('cultura-clima');
      if (!root) return;
      var clima = (state.cultura && state.cultura.clima) || null;
      if (!clima) {
        root.innerHTML =
          '<p class="muted">Pesquisa de clima ainda não carregada.</p>';
        return;
      }
      var r = clima.resumo || {};
      var comps = r.comparativos || {};
      var pilares = (clima.pilares || [])
        .slice()
        .sort(function (a, b) {
          return Number(b.nota) - Number(a.nota);
        })
        .map(function (p) {
          return (
            '<li class="clima-pilar">' +
            '<div class="clima-pilar-top"><span>' +
            escapeHtml(p.nome) +
            '</span><strong>' +
            Number(p.nota).toFixed(2) +
            '</strong></div>' +
            '<div class="clima-bar"><span style="width:' +
            Math.max(0, Math.min(100, Number(p.nota) * 10)) +
            '%"></span></div>' +
            '<span class="' +
            deltaClass(p.variacao) +
            '">' +
            formatSigned(p.variacao, 2) +
            '</span></li>'
          );
        })
        .join('');
      var recs = (clima.recomendacoes || [])
        .map(function (rec) {
          return (
            '<li><strong>' +
            escapeHtml(rec.acao) +
            '</strong><span class="muted"> · ' +
            escapeHtml(rec.pilar) +
            '</span></li>'
          );
        })
        .join('');

      root.innerHTML =
        '<div class="clima-hero">' +
        '<div class="ini-meta">' +
        '<span class="status-pill">' +
        escapeHtml(clima.plataforma || 'TeamCulture') +
        '</span>' +
        '<span>' +
        escapeHtml(clima.grupo || '') +
        '</span>' +
        '<span>Atualizado ' +
        escapeHtml(formatBr(clima.atualizadoEm)) +
        '</span>' +
        '</div>' +
        '<h2>' +
        escapeHtml(clima.titulo || 'Pesquisa de clima') +
        '</h2>' +
        '<p class="muted">Notas dos ' +
        escapeHtml(clima.periodoNotas || 'últimos 90 dias') +
        ' · variação em ' +
        escapeHtml(clima.variacaoJanela || '12 meses') +
        (clima.urlPlataforma
          ? ' · <a href="' +
            escapeHtml(clima.urlPlataforma) +
            '" target="_blank" rel="noopener noreferrer">abrir TeamCulture</a>'
          : '') +
        '</p>' +
        '</div>' +
        '<div class="clima-kpi-row">' +
        '<div class="clima-kpi clima-kpi-main"><span class="clima-kpi-label">Média de engajamento</span><strong>' +
        Number(r.mediaEngajamento).toFixed(2) +
        '</strong><span>' +
        escapeHtml(r.escala || '') +
        ' · <span class="' +
        deltaClass(r.variacao360d) +
        '">' +
        formatSigned(r.variacao360d, 2) +
        ' pts / 360d</span></span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Rank</span><strong>' +
        escapeHtml(r.rank || '—') +
        '</strong><span class="muted">melhor que ' +
        formatPct(r.melhorQueEmpresasPct, 2) +
        '</span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Participação</span><strong>' +
        formatPct(r.participacaoPct) +
        '</strong><span class="' +
        deltaClass(r.participacaoVariacaoPct) +
        '">' +
        formatSigned(r.participacaoVariacaoPct, 0) +
        ' pp</span></div>' +
        '<div class="clima-kpi"><span class="clima-kpi-label">Opiniões respondidas</span><strong>' +
        formatPct(r.opinionesRespondidasPct, 2) +
        '</strong><span class="' +
        deltaClass(r.opinionesVariacaoPct) +
        '">' +
        formatSigned(r.opinionesVariacaoPct, 2) +
        ' pp</span></div>' +
        '</div>' +
        '<div class="clima-compare">' +
        '<span>Grupo <strong>' +
        Number(comps.grupo).toFixed(2) +
        '</strong></span>' +
        '<span>Grupo Boticário <strong>' +
        Number(comps.grupoBoticario).toFixed(2) +
        '</strong></span>' +
        '<span>Benchmark TeamCulture <strong>' +
        Number(comps.benchmarkTeamCulture).toFixed(2) +
        '</strong></span>' +
        '</div>' +
        '<section class="clima-section">' +
        '<h3>10 pilares de engajamento</h3>' +
        (clima.atencao
          ? '<p class="doc-note">' + escapeHtml(clima.atencao) + '</p>'
          : '') +
        '<ul class="clima-pilares">' +
        pilares +
        '</ul></section>' +
        renderNpsBlock('eNPS (Employee Net Promoter Score)', clima.enps) +
        renderNpsBlock('LNPS (Leadership Net Promoter Score)', clima.lnps) +
        '<section class="clima-section">' +
        '<h3>Recomendações de melhoria</h3>' +
        '<ul class="clima-recs">' +
        recs +
        '</ul></section>';
    }

    function showCulturaPage(page) {
      state.culturaPage = page || 'guia';
      var guia = document.getElementById('cultura-guia');
      var clima = document.getElementById('cultura-clima');
      var headerCopy = document.getElementById('cultura-header-copy');
      var data = state.cultura || {};

      document.querySelectorAll('[data-cultura]').forEach(function (btn) {
        btn.classList.toggle(
          'is-active',
          btn.getAttribute('data-cultura') === state.culturaPage
        );
      });

      if (state.culturaPage === 'clima') {
        if (guia) guia.hidden = true;
        if (clima) clima.hidden = false;
        if (headerCopy) {
          headerCopy.textContent =
            'Pesquisa de clima TeamCulture — semana 1 de novembro/2026.';
        }
        renderCulturaClima();
        return;
      }

      if (guia) guia.hidden = false;
      if (clima) clima.hidden = true;
      if (headerCopy) {
        if (data.fonte && data.nomeDocumento) {
          headerCopy.innerHTML =
            'Fonte: <a href="' +
            escapeHtml(data.fonte) +
            '" target="_blank" rel="noopener noreferrer">' +
            escapeHtml(data.nomeDocumento) +
            '</a>';
        } else {
          headerCopy.textContent =
            'DoR, DoD e Tenets do Guia de trabalho — Interfaces Conversacionais.';
        }
      }
      renderCulturaGuia();
    }

    function renderCultura() {
      showCulturaPage(state.culturaPage || 'guia');
    }

    function setGreetingDate() {
      var el = document.getElementById('greeting-date');
      if (!el) return;
      var now = new Date();
      el.textContent =
        DIAS_SEMANA[now.getDay()] +
        ', ' +
        now.getDate() +
        ' de ' +
        MESES[now.getMonth()] +
        ' de ' +
        now.getFullYear();
    }

    function bindNav() {
      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setView(btn.getAttribute('data-view'));
        });
      });

      document.querySelectorAll('.ini-sub-btn[data-ini="lista"]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          showIniciativa(null);
        });
      });

      document.querySelectorAll('[data-cultura]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          showCulturaPage(btn.getAttribute('data-cultura'));
        });
      });

      document.getElementById('btn-prev-month').addEventListener('click', function () {
        state.month -= 1;
        if (state.month < 0) {
          state.month = 11;
          state.year -= 1;
        }
        renderCalendar();
      });

      document.getElementById('btn-next-month').addEventListener('click', function () {
        state.month += 1;
        if (state.month > 11) {
          state.month = 0;
          state.year += 1;
        }
        renderCalendar();
      });

      document.querySelectorAll('.year-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.year = Number(btn.getAttribute('data-year'));
          renderCalendar();
        });
      });
    }

    function boot(seed, ferias, iniciativas, cultura) {
      state.seed = seed || { feriados: [], eventos: [], ausencias: [] };
      if (!state.seed.ausencias && ferias && ferias.ausencias) {
        state.seed.ausencias = ferias.ausencias;
      }
      state.ferias = ferias || { pessoas: [], ausencias: state.seed.ausencias || [] };
      state.iniciativas = iniciativas || { iniciativas: [] };
      state.cultura = cultura || { secoes: [] };
      setGreetingDate();
      bindNav();
      renderFerias();
      showIniciativa(null);
      renderCultura();
      setView('calendario');
      renderCalendar();
    }

    function bootFromFallback() {
      var fb = window.__GESTOR360_FALLBACK_SEED__ || {};
      boot(
        {
          anos: fb.anos || [2026, 2027],
          feriados: fb.feriados || [],
          eventos: fb.eventos || [],
          ausencias: fb.ausencias || []
        },
        fb.ferias || { pessoas: fb.pessoas || [], ausencias: fb.ausencias || [] },
        fb.iniciativasPayload || { iniciativas: fb.iniciativas || [] },
        fb.culturaPayload || { secoes: fb.cultura || [] }
      );
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      var calSeed = null;
      var feriasSeed = null;
      var iniSeed = null;
      var culturaSeed = null;
      var pending = 4;

      function maybeBoot() {
        pending -= 1;
        if (pending === 0) boot(calSeed, feriasSeed, iniSeed, culturaSeed);
      }

      google.script.run
        .withSuccessHandler(function (data) {
          calSeed = data;
          maybeBoot();
        })
        .withFailureHandler(bootFromFallback)
        .getCalendarioSeed();

      google.script.run
        .withSuccessHandler(function (data) {
          feriasSeed = data;
          maybeBoot();
        })
        .withFailureHandler(function () {
          feriasSeed = { pessoas: [], ausencias: [] };
          maybeBoot();
        })
        .getFerias();

      google.script.run
        .withSuccessHandler(function (data) {
          iniSeed = data;
          maybeBoot();
        })
        .withFailureHandler(function () {
          iniSeed = { iniciativas: [] };
          maybeBoot();
        })
        .getIniciativas();

      google.script.run
        .withSuccessHandler(function (data) {
          culturaSeed = data;
          maybeBoot();
        })
        .withFailureHandler(function () {
          culturaSeed = { secoes: [] };
          maybeBoot();
        })
        .getCultura();
    } else {
      bootFromFallback();
    }
  })();
</script>
