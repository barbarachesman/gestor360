<script>
  (function () {
    var MESES = [
      'janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho',
      'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'
    ];

    var DIAS_SEMANA = [
      'domingo', 'segunda-feira', 'terça-feira', 'quarta-feira',
      'quinta-feira', 'sexta-feira', 'sábado'
    ];

    var state = {
      year: 2026,
      month: 10,
      selected: null,
      seed: null,
      ferias: null
    };

    function parseYmd(ymd) {
      var p = ymd.split('-');
      return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    }

    function toYmd(date) {
      var y = date.getFullYear();
      var m = String(date.getMonth() + 1).padStart(2, '0');
      var d = String(date.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + d;
    }

    function formatBr(ymd) {
      if (!ymd) return '—';
      var p = ymd.split('-');
      return p[2] + '/' + p[1] + '/' + p[0];
    }

    function eachDateInRange(startYmd, endYmd) {
      var out = [];
      var cur = parseYmd(startYmd);
      var end = parseYmd(endYmd || startYmd);
      while (cur <= end) {
        out.push(toYmd(cur));
        cur.setDate(cur.getDate() + 1);
      }
      return out;
    }

    function expandItems(seed) {
      var byDate = {};

      function add(date, item) {
        if (!byDate[date]) byDate[date] = [];
        byDate[date].push(item);
      }

      (seed.feriados || []).forEach(function (f) {
        eachDateInRange(f.date, f.endDate || f.date).forEach(function (d) {
          add(d, {
            name: f.name,
            tipo: f.tipo || 'nacional',
            origem: 'feriado'
          });
        });
      });

      (seed.eventos || []).forEach(function (e) {
        eachDateInRange(e.start, e.end || e.start).forEach(function (d) {
          add(d, {
            name: e.name,
            tipo: e.tipo || 'evento',
            origem: 'evento'
          });
        });
      });

      (seed.ausencias || []).forEach(function (a) {
        if (!a.inicio || !a.termino) return;
        eachDateInRange(a.inicio, a.termino).forEach(function (d) {
          add(d, {
            name: 'Férias · ' + a.nome + (a.statusProgramacao ? ' (' + a.statusProgramacao + ')' : ''),
            tipo: 'ferias',
            origem: 'ferias'
          });
        });
      });

      return byDate;
    }

    function uniqueTipos(items) {
      var seen = {};
      var out = [];
      items.forEach(function (it) {
        var t = it.tipo || 'evento';
        if (!seen[t]) {
          seen[t] = true;
          out.push(t);
        }
      });
      return out;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function statusClass(label) {
      var s = String(label || '').toLowerCase();
      if (s.indexOf('efetiv') >= 0) return 'efetivada';
      if (s.indexOf('aprovad') >= 0) return 'aprovada';
      if (s.indexOf('aguard') >= 0) return 'aguardando';
      if (s.indexOf('programar') >= 0) return 'programar';
      if (s.indexOf('completo') >= 0) return 'completo';
      if (s.indexOf('incompleto') >= 0) return 'incompleto';
      return 'programar';
    }

    function setView(viewId) {
      var views = ['ferias', 'calendario', 'iniciativas', 'ajuda', 'cultura'];
      views.forEach(function (id) {
        var el = document.getElementById('view-' + id);
        if (el) el.hidden = id !== viewId;
      });
      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        var active = btn.getAttribute('data-view') === viewId;
        btn.classList.toggle('is-active', active);
        btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
    }

    function syncYearButtons() {
      document.querySelectorAll('.year-btn').forEach(function (btn) {
        var y = Number(btn.getAttribute('data-year'));
        btn.classList.toggle('is-active', y === state.year);
      });
    }

    function renderMonthList(byDate) {
      var list = document.getElementById('month-events');
      list.innerHTML = '';
      var y = state.year;
      var m = state.month;
      var keys = Object.keys(byDate).filter(function (k) {
        var d = parseYmd(k);
        return d.getFullYear() === y && d.getMonth() === m;
      }).sort();

      if (!keys.length) {
        list.innerHTML = '<li class="muted">Nenhum feriado, evento ou férias neste mês.</li>';
        return;
      }

      var seenNames = {};
      keys.forEach(function (k) {
        byDate[k].forEach(function (it) {
          var key = k + '|' + it.name;
          if (seenNames[key]) return;
          seenNames[key] = true;
          var li = document.createElement('li');
          var day = k.slice(8);
          li.innerHTML =
            '<span class="event-tipo">' + day + ' · ' + it.tipo + '</span>' +
            escapeHtml(it.name);
          list.appendChild(li);
        });
      });
    }

    function showDetail(ymd, items) {
      var title = document.getElementById('detail-title');
      var list = document.getElementById('detail-list');
      var d = parseYmd(ymd);
      title.textContent =
        d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
      list.innerHTML = '';

      if (!items || !items.length) {
        list.innerHTML = '<li class="muted">Sem feriados, eventos ou férias neste dia.</li>';
        return;
      }

      items.forEach(function (it) {
        var li = document.createElement('li');
        li.innerHTML =
          '<span class="event-tipo">' + escapeHtml(it.tipo) + '</span>' +
          escapeHtml(it.name);
        list.appendChild(li);
      });
    }

    function renderCalendar() {
      var byDate = expandItems(state.seed);
      var grid = document.getElementById('calendar-grid');
      var label = document.getElementById('month-label');
      label.textContent = MESES[state.month] + ' ' + state.year;
      syncYearButtons();

      var first = new Date(state.year, state.month, 1);
      var startPad = first.getDay();
      var daysInMonth = new Date(state.year, state.month + 1, 0).getDate();
      var prevDays = new Date(state.year, state.month, 0).getDate();

      grid.innerHTML = '';
      var todayYmd = toYmd(new Date());
      var totalCells = 42;

      for (var i = 0; i < totalCells; i++) {
        var dayNum;
        var cellDate;
        var outside = false;

        if (i < startPad) {
          dayNum = prevDays - startPad + i + 1;
          cellDate = new Date(state.year, state.month - 1, dayNum);
          outside = true;
        } else if (i >= startPad + daysInMonth) {
          dayNum = i - (startPad + daysInMonth) + 1;
          cellDate = new Date(state.year, state.month + 1, dayNum);
          outside = true;
        } else {
          dayNum = i - startPad + 1;
          cellDate = new Date(state.year, state.month, dayNum);
        }

        var ymd = toYmd(cellDate);
        var items = byDate[ymd] || [];
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-cell';
        if (outside) btn.classList.add('is-outside');
        if (ymd === todayYmd) btn.classList.add('is-today');
        if (state.selected === ymd) btn.classList.add('is-selected');
        btn.setAttribute('data-date', ymd);
        btn.setAttribute('aria-label', ymd);

        var marks = uniqueTipos(items)
          .map(function (t) {
            return '<span class="mark ' + t + '"></span>';
          })
          .join('');

        var shortLabel = items.length
          ? '<span class="day-label">' + escapeHtml(items[0].name) + '</span>'
          : '';

        btn.innerHTML =
          '<span class="day-num">' + dayNum + '</span>' +
          '<span class="day-marks">' + marks + '</span>' +
          shortLabel;

        btn.addEventListener('click', function (ev) {
          var date = ev.currentTarget.getAttribute('data-date');
          state.selected = date;
          renderCalendar();
          showDetail(date, byDate[date] || []);
        });

        grid.appendChild(btn);
      }

      renderMonthList(byDate);

      if (state.selected) {
        var sel = parseYmd(state.selected);
        if (sel.getFullYear() === state.year && sel.getMonth() === state.month) {
          showDetail(state.selected, byDate[state.selected] || []);
        }
      }
    }

    function renderFerias() {
      var root = document.getElementById('ferias-list');
      if (!root) return;
      var pessoas = (state.ferias && state.ferias.pessoas) || [];
      root.innerHTML = '';

      if (!pessoas.length) {
        root.innerHTML = '<div class="panel"><p class="muted">Nenhuma férias carregada.</p></div>';
        return;
      }

      pessoas.forEach(function (p) {
        var card = document.createElement('article');
        card.className = 'ferias-card';

        var head =
          '<div class="ferias-card-head">' +
          '<h3>' + escapeHtml(p.nome) + '</h3>' +
          '<span class="ferias-mat">Matrícula ' + escapeHtml(p.matricula) + '</span>' +
          '</div>';

        var body = '';
        (p.periodos || []).forEach(function (per) {
          body +=
            '<div class="periodo-block">' +
            '<div class="periodo-meta">' +
            '<span class="status-pill ' + statusClass(per.status) + '">' +
            escapeHtml(per.status || '—') +
            '</span>' +
            '<span>Saldo: <strong>' + escapeHtml(per.saldo || '—') + '</strong></span>' +
            '<span>Aquisitivo: ' +
            formatBr(per.aquisitivoInicio) +
            ' – ' +
            formatBr(per.aquisitivoFim) +
            '</span>' +
            '<span>Limite saída: ' + formatBr(per.limiteSaida) + '</span>' +
            '</div>';

          body +=
            '<table class="prog-table"><thead><tr>' +
            '<th>Programação</th><th>Início</th><th>Término</th><th>Dias</th><th>Status</th>' +
            '</tr></thead><tbody>';

          (per.programacoes || []).forEach(function (prog) {
            body +=
              '<tr>' +
              '<td>' + escapeHtml(prog.ordem || '—') + '</td>' +
              '<td>' + formatBr(prog.inicio) + '</td>' +
              '<td>' + formatBr(prog.termino) + '</td>' +
              '<td>' + escapeHtml(String(prog.dias != null ? prog.dias : '—')) + '</td>' +
              '<td><span class="status-pill ' +
              statusClass(prog.statusProgramacao) +
              '">' +
              escapeHtml(prog.statusProgramacao || '—') +
              '</span></td>' +
              '</tr>';
          });

          body += '</tbody></table></div>';
        });

        card.innerHTML = head + body;
        root.appendChild(card);
      });
    }

    function setGreetingDate() {
      var el = document.getElementById('greeting-date');
      if (!el) return;
      var now = new Date();
      el.textContent =
        DIAS_SEMANA[now.getDay()] +
        ', ' +
        now.getDate() +
        ' de ' +
        MESES[now.getMonth()] +
        ' de ' +
        now.getFullYear();
    }

    function bindNav() {
      document.querySelectorAll('.nav-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setView(btn.getAttribute('data-view'));
        });
      });

      document.getElementById('btn-prev-month').addEventListener('click', function () {
        state.month -= 1;
        if (state.month < 0) {
          state.month = 11;
          state.year -= 1;
        }
        renderCalendar();
      });

      document.getElementById('btn-next-month').addEventListener('click', function () {
        state.month += 1;
        if (state.month > 11) {
          state.month = 0;
          state.year += 1;
        }
        renderCalendar();
      });

      document.querySelectorAll('.year-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.year = Number(btn.getAttribute('data-year'));
          renderCalendar();
        });
      });
    }

    function boot(seed, ferias) {
      state.seed = seed || { feriados: [], eventos: [], ausencias: [] };
      if (!state.seed.ausencias && ferias && ferias.ausencias) {
        state.seed.ausencias = ferias.ausencias;
      }
      state.ferias = ferias || { pessoas: [], ausencias: state.seed.ausencias || [] };
      setGreetingDate();
      bindNav();
      renderFerias();
      setView('calendario');
      renderCalendar();
    }

    function bootFromFallback() {
      var fb = window.__GESTOR360_FALLBACK_SEED__ || {};
      boot(
        {
          anos: fb.anos || [2026, 2027],
          feriados: fb.feriados || [],
          eventos: fb.eventos || [],
          ausencias: fb.ausencias || []
        },
        fb.ferias || { pessoas: fb.pessoas || [], ausencias: fb.ausencias || [] }
      );
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      var calSeed = null;
      var feriasSeed = null;
      var pending = 2;

      function maybeBoot() {
        pending -= 1;
        if (pending === 0) boot(calSeed, feriasSeed);
      }

      google.script.run
        .withSuccessHandler(function (data) {
          calSeed = data;
          maybeBoot();
        })
        .withFailureHandler(bootFromFallback)
        .getCalendarioSeed();

      google.script.run
        .withSuccessHandler(function (data) {
          feriasSeed = data;
          maybeBoot();
        })
        .withFailureHandler(function () {
          feriasSeed = { pessoas: [], ausencias: [] };
          maybeBoot();
        })
        .getFerias();
    } else {
      bootFromFallback();
    }
  })();
</script>
