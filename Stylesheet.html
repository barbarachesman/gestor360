<style>
  :root {
    --ink: #14201c;
    --ink-soft: #3d4f47;
    --muted: #6b7c74;
    --paper: #f3f7f4;
    --paper-strong: #ffffff;
    --line: rgba(20, 32, 28, 0.12);
    --brand: #0f6b57;
    --brand-deep: #0a4a3c;
    --accent: #c45c26;
    --nacional: #0f6b57;
    --ponte: #2a7a9b;
    --recesso: #6b5b95;
    --evento: #c45c26;
    --aviso: #b08900;
    --shadow: 0 18px 40px rgba(15, 50, 40, 0.08);
    --radius: 18px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-ui: 'Outfit', 'Segoe UI', sans-serif;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    min-height: 100%;
  }

  body {
    font-family: var(--font-ui);
    color: var(--ink);
    background: var(--paper);
    line-height: 1.45;
  }

  .app-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 80% 50% at 10% -10%, rgba(15, 107, 87, 0.18), transparent 55%),
      radial-gradient(ellipse 60% 40% at 90% 0%, rgba(196, 92, 38, 0.12), transparent 50%),
      linear-gradient(165deg, #e8f2ed 0%, #f3f7f4 40%, #eef2f0 100%);
  }

  .topbar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.75rem 1.5rem 1rem;
    max-width: 1120px;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    width: 3.25rem;
    height: 3.25rem;
    border-radius: 1rem;
    background: linear-gradient(145deg, var(--brand) 0%, var(--brand-deep) 100%);
    color: #f7fffb;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: -0.03em;
    box-shadow: var(--shadow);
  }

  .brand-name {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.85rem, 4vw, 2.45rem);
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--brand-deep);
  }

  .brand-tag,
  .topbar-note {
    margin: 0.2rem 0 0;
    color: var(--muted);
    font-size: 0.92rem;
  }

  .topbar-note {
    text-align: right;
    max-width: 14rem;
  }

  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.45rem;
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 1.5rem 1rem;
  }

  .nav-btn {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.55);
    color: var(--ink-soft);
    font: inherit;
    font-weight: 500;
    padding: 0.55rem 0.95rem;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .nav-btn:hover {
    background: rgba(255, 255, 255, 0.9);
    color: var(--ink);
  }

  .nav-btn.is-active {
    background: var(--brand-deep);
    border-color: var(--brand-deep);
    color: #f4fffa;
  }

  .main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 1.5rem 2.5rem;
  }

  .view-header {
    margin-bottom: 1.1rem;
  }

  .view-header h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 1.55rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .view-header p {
    margin: 0.35rem 0 0;
    color: var(--muted);
  }

  .view-header-cal {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 0.35rem;
  }

  .month-label {
    margin: 0;
    min-width: 11rem;
    text-align: center;
    font-family: var(--font-display);
    font-size: 1.2rem;
    font-weight: 600;
    text-transform: capitalize;
  }

  .icon-btn {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.7rem;
    border: 1px solid var(--line);
    background: var(--paper-strong);
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
    color: var(--ink);
  }

  .icon-btn:hover {
    border-color: var(--brand);
    color: var(--brand);
  }

  .cal-layout {
    display: grid;
    grid-template-columns: minmax(0, 1.6fr) minmax(240px, 0.9fr);
    gap: 1rem;
    align-items: start;
  }

  .calendar-wrap,
  .side-panel,
  .placeholder-panel {
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(8px);
  }

  .calendar-wrap {
    padding: 0.85rem;
  }

  .weekday-row,
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 0.35rem;
  }

  .weekday-row {
    margin-bottom: 0.4rem;
  }

  .weekday-row span {
    text-align: center;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .day-cell {
    min-height: 4.6rem;
    border: 1px solid transparent;
    border-radius: 0.85rem;
    padding: 0.35rem 0.4rem;
    background: rgba(243, 247, 244, 0.65);
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .day-cell:hover {
    border-color: rgba(15, 107, 87, 0.35);
    transform: translateY(-1px);
  }

  .day-cell.is-outside {
    opacity: 0.38;
  }

  .day-cell.is-today {
    box-shadow: inset 0 0 0 1.5px var(--brand);
  }

  .day-cell.is-selected {
    background: #fff;
    border-color: var(--brand-deep);
  }

  .day-num {
    font-weight: 600;
    font-size: 0.92rem;
  }

  .day-marks {
    display: flex;
    flex-wrap: wrap;
    gap: 0.2rem;
  }

  .mark {
    width: 0.45rem;
    height: 0.45rem;
    border-radius: 50%;
  }

  .mark.nacional { background: var(--nacional); }
  .mark.ponte { background: var(--ponte); }
  .mark.recesso { background: var(--recesso); }
  .mark.evento { background: var(--evento); }
  .mark.aviso { background: var(--aviso); }
  .mark.feriado { background: var(--nacional); }

  .day-label {
    font-size: 0.62rem;
    color: var(--ink-soft);
    line-height: 1.2;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  .side-panel {
    padding: 1rem 1.05rem 1.15rem;
    display: grid;
    gap: 1.1rem;
  }

  .side-panel h3 {
    margin: 0 0 0.45rem;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    font-weight: 600;
  }

  .legend ul,
  .detail-list,
  .month-events {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .legend li {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.35rem;
    font-size: 0.9rem;
  }

  .dot {
    width: 0.65rem;
    height: 0.65rem;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot.nacional { background: var(--nacional); }
  .dot.ponte { background: var(--ponte); }
  .dot.recesso { background: var(--recesso); }
  .dot.evento { background: var(--evento); }
  .dot.aviso { background: var(--aviso); }

  .detail-list li,
  .month-events li {
    padding: 0.45rem 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }

  .detail-list li:last-child,
  .month-events li:last-child {
    border-bottom: 0;
  }

  .event-tipo {
    display: inline-block;
    margin-right: 0.35rem;
    font-size: 0.68rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .placeholder-panel {
    padding: 1.4rem 1.25rem;
  }

  .placeholder-panel p {
    margin: 0 0 0.5rem;
  }

  .muted {
    color: var(--muted);
  }

  code {
    font-size: 0.85em;
    background: rgba(15, 107, 87, 0.08);
    padding: 0.1em 0.35em;
    border-radius: 0.35em;
  }

  .footer {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 1.5rem 2rem;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.5rem;
    color: var(--muted);
    font-size: 0.82rem;
  }

  @media (max-width: 860px) {
    .cal-layout {
      grid-template-columns: 1fr;
    }

    .topbar {
      flex-direction: column;
      align-items: flex-start;
    }

    .topbar-note {
      text-align: left;
    }

    .day-cell {
      min-height: 3.6rem;
    }

    .day-label {
      display: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .nav-btn,
    .day-cell,
    .icon-btn {
      transition: none;
    }
  }
</style>
